name: Prisma Photonics
description: Prisma Photonics is an infrastructure-monitoring company that turns existing
  optical fiber into a continuous sensing network using its Hyper-Scan Fiber-Sensing
  distributed acoustic sensing technology. The platform measures strain, temperature,
  pressure, and acoustic signatures at every point along hundreds of kilometers of fiber
  with sub-meter resolution, and applies AI-driven classification to detect and identify
  events in real time. It is used to protect and monitor power lines, oil and gas
  pipelines, perimeters, subsea assets, and smart rail and road infrastructure. Backed
  by Insight Partners, the company was added to the API Evangelist network as a portfolio
  lead; as of this enrichment pass it publishes no public API or developer program.
